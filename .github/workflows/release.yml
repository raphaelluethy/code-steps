name: Release

# Push a tag like v0.2.3 to publish a GitHub release with the plugin ZIP.
# The tag must match pluginVersion in gradle.properties, and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the tag matches the plugin version
        run: |
          version="$(sed -n 's/^pluginVersion *= *//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Read the release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            /^## / { found = ($2 == "[" version "]") ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Test and build the plugin
        run: ./gradlew test buildPlugin
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/distributions/code-steps-$VERSION.zip"
          --title "Code Steps $VERSION"
          --notes-file release-notes.md
